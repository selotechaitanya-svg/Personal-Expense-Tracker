services:
  # ----------------------------------------------------------------------------
  # FastAPI Application Service
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expense_tracker_api
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:8000"
    environment:
      - ENVIRONMENT=production
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - DOCS_ENABLED=true
      - LOG_LEVEL=INFO
      # Default: persistent SQLite database inside the container data directory
      # To switch to PostgreSQL, comment out the line below and uncomment the Postgres DATABASE_URL
      - DATABASE_URL=sqlite:////app/data/expenses.db
      # - DATABASE_URL=postgresql://expense_user:expense_secret_password@db:5432/expenses_db
    volumes:
      - expense_data:/app/data
    # Uncomment 'depends_on' if using the PostgreSQL database service below:
    # depends_on:
    #   db:
    #     condition: service_healthy

  # ----------------------------------------------------------------------------
  # Optional Managed PostgreSQL Database Service
  # Uncomment if you want to deploy or test with PostgreSQL instead of SQLite
  # ----------------------------------------------------------------------------
  # db:
  #   image: postgres:16-alpine
  #   container_name: expense_tracker_db
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: expense_user
  #     POSTGRES_PASSWORD: expense_secret_password
  #     POSTGRES_DB: expenses_db
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U expense_user -d expenses_db"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 5

volumes:
  expense_data:
    driver: local
  # postgres_data:
  #   driver: local
