services:
  - type: web
    name: expense-tracker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: DOCS_ENABLED
        value: "true"
      # If attaching a Render PostgreSQL database, reference it here:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: expense-tracker-db
      #     property: connectionString

# Optional Render Managed PostgreSQL Database (uncomment if desired)
# databases:
#   - name: expense-tracker-db
#     databaseName: expenses_db
#     user: expense_user
#     plan: free
